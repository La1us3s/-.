<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starred Repositories</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">MY COLLECTION</p>
      <h1>Starred repositories</h1>
      <p class="intro">A journal of repositories I've starred.</p>
    </header>
    <section aria-labelledby="repositories-heading">
      <h2 id="repositories-heading" class="section-title">Repositories</h2>
      <p id="status" class="status" role="status">Loading repositories…</p>
      <ul id="repository-list" class="repository-list"></ul>
    </section>
  </main>
</body>
</html>
